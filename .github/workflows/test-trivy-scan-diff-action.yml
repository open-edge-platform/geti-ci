# Integration tests for Trivy Scan Diff composite action

name: Test Trivy Scan Diff Action

on:
  pull_request:
    paths:
      - "actions/trivy-scan-diff/**"
      - ".github/workflows/test-trivy-scan-diff-action.yml"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
    paths:
      - "actions/trivy-scan-diff/**"
      - ".github/workflows/test-trivy-scan-diff-action.yml"
  workflow_dispatch:

permissions: {}

jobs:
  # Test 1: Basic functionality — target built on a digest-pinned base produces
  # a valid diff report and outputs.
  trivy-scan-diff-basic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - &harden-runner
        name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve base image digest
        id: base
        shell: bash
        run: |
          docker pull alpine:3.19
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' alpine:3.19)
          echo "base_image=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build target image on top of the base
        shell: bash
        run: |
          cat > Dockerfile <<'EOF'
          FROM alpine:3.19
          RUN apk add --no-cache curl
          EOF
          docker build -t trivy-scan-diff-test-target:latest .

      - name: Run Trivy Scan Diff
        id: trivy-scan-diff
        uses: $/actions/trivy-scan-diff
        with:
          image: trivy-scan-diff-test-target:latest
          base-image: ${{ steps.base.outputs.base_image }}
          artifact-name: trivy-scan-diff-basic-test

      - name: Verify outputs and report files
        shell: bash
        env:
          SCAN_RESULT: ${{ steps.trivy-scan-diff.outputs.scan_result }}
          REPORT_PATH: ${{ steps.trivy-scan-diff.outputs.report_path }}
          JSON_REPORT_PATH: ${{ steps.trivy-scan-diff.outputs.json_report_path }}
          IMAGE_SCAN_REPORT_PATH: ${{ steps.trivy-scan-diff.outputs.image_scan_report_path }}
          BASE_IMAGE_SCAN_REPORT_PATH: ${{ steps.trivy-scan-diff.outputs.base_image_scan_report_path }}
          NON_BASE_CVE_COUNT: ${{ steps.trivy-scan-diff.outputs.non_base_cve_count }}
          BASE_CVE_COUNT: ${{ steps.trivy-scan-diff.outputs.base_cve_count }}
          BASE_IMAGE_IS_LATEST: ${{ steps.trivy-scan-diff.outputs.base_image_is_latest }}
        run: |
          if [[ "$SCAN_RESULT" != "0" ]]; then
            echo "Error: expected scan_result=0, got '$SCAN_RESULT'"
            exit 1
          fi
          for f in "$REPORT_PATH" "$JSON_REPORT_PATH" "$IMAGE_SCAN_REPORT_PATH" "$BASE_IMAGE_SCAN_REPORT_PATH"; do
            if [[ ! -f "$f" ]]; then
              echo "Error: expected report file '$f' to exist"
              exit 1
            fi
          done
          if ! grep -q "## Non-base image CVEs" "$REPORT_PATH" || ! grep -q "## Base image CVEs" "$REPORT_PATH"; then
            echo "Error: markdown report is missing one of the required sections"
            exit 1
          fi
          if ! [[ "$NON_BASE_CVE_COUNT" =~ ^[0-9]+$ ]] || ! [[ "$BASE_CVE_COUNT" =~ ^[0-9]+$ ]]; then
            echo "Error: expected non_base_cve_count/base_cve_count to be non-negative integers"
            exit 1
          fi
          if [[ ! "$BASE_IMAGE_IS_LATEST" =~ ^(true|false|unknown)$ ]]; then
            echo "Error: expected base_image_is_latest to be true/false/unknown, got '$BASE_IMAGE_IS_LATEST'"
            exit 1
          fi
          echo "✅ Basic test passed (non_base=$NON_BASE_CVE_COUNT, base=$BASE_CVE_COUNT, base_is_latest=$BASE_IMAGE_IS_LATEST)"

  # Test 2: An unpinned base-image (no @sha256 digest) must fail fast, before any scan runs.
  trivy-scan-diff-unpinned-base-fails-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - *harden-runner

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy Scan Diff with unpinned base-image
        id: trivy-scan-diff
        continue-on-error: true
        uses: $/actions/trivy-scan-diff
        with:
          image: alpine:3.19
          base-image: alpine:3.19 # no digest — must be rejected
          artifact-name: trivy-scan-diff-unpinned-base-test

      - name: Verify the action failed validation
        shell: bash
        env:
          OUTCOME: ${{ steps.trivy-scan-diff.outcome }}
        run: |
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "Error: expected the action to fail for an unpinned base-image, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "✅ Unpinned base-image was correctly rejected"

  # Test 3: Best-effort "is base latest" check against the actual current :latest digest.
  trivy-scan-diff-latest-check-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - *harden-runner

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve current alpine:latest digest
        id: base
        shell: bash
        run: |
          docker pull alpine:latest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' alpine:latest)
          echo "base_image=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Run Trivy Scan Diff
        id: trivy-scan-diff
        uses: $/actions/trivy-scan-diff
        with:
          image: ${{ steps.base.outputs.base_image }}
          base-image: ${{ steps.base.outputs.base_image }}
          artifact-name: trivy-scan-diff-latest-check-test

      - name: Verify base_image_is_latest output
        shell: bash
        env:
          BASE_IMAGE_IS_LATEST: ${{ steps.trivy-scan-diff.outputs.base_image_is_latest }}
        run: |
          if [[ -z "$BASE_IMAGE_IS_LATEST" ]]; then
            echo "Error: base_image_is_latest output is empty"
            exit 1
          fi
          if [[ ! "$BASE_IMAGE_IS_LATEST" =~ ^(true|false|unknown)$ ]]; then
            echo "Error: unexpected base_image_is_latest value '$BASE_IMAGE_IS_LATEST'"
            exit 1
          fi
          echo "✅ base_image_is_latest=$BASE_IMAGE_IS_LATEST (tolerating 'unknown' due to possible registry/network flakiness)"

  # Summary job - provides single point of success/failure
  trivy-scan-diff-test-summary:
    runs-on: ubuntu-latest
    needs:
      - trivy-scan-diff-basic-test
      - trivy-scan-diff-unpinned-base-fails-test
      - trivy-scan-diff-latest-check-test
    if: always()
    steps:
      - name: Check test results
        shell: bash
        env:
          BASIC_RESULT: ${{ needs.trivy-scan-diff-basic-test.result }}
          UNPINNED_RESULT: ${{ needs.trivy-scan-diff-unpinned-base-fails-test.result }}
          LATEST_CHECK_RESULT: ${{ needs.trivy-scan-diff-latest-check-test.result }}
        run: |
          if [[ "$BASIC_RESULT" != "success" ]]; then
            echo "❌ Basic test failed"
            exit 1
          fi
          if [[ "$UNPINNED_RESULT" != "success" ]]; then
            echo "❌ Unpinned base-image test failed"
            exit 1
          fi
          if [[ "$LATEST_CHECK_RESULT" != "success" ]]; then
            echo "❌ Latest-check test failed"
            exit 1
          fi
          echo "✅ All Trivy Scan Diff action tests passed successfully!"
