# TEMPORARY workflow for manually testing Trivy Scan Diff against real Geti images.
# Safe to delete once the testing is done.

name: (Temporary) Trivy Scan Diff - Geti Images

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-trivy-scan-diff-geti-images.yml"

permissions: {}

jobs:
  trivy-scan-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/open-edge-platform/geti-cpu:develop
          - ghcr.io/open-edge-platform/geti-cuda:develop
          - ghcr.io/open-edge-platform/geti-xpu:develop
    steps:

      - name: Sanitize image name for artifact
        id: sanitize
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          SAFE_NAME=$(printf '%s' "$IMAGE" | tr -c 'a-zA-Z0-9._-' '-')
          echo "artifact_name=trivy-scan-diff-${SAFE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Run Trivy Scan Diff
        id: trivy-scan-diff
        uses: $/actions/trivy-scan-diff
        with:
          image: ${{ matrix.image }}
          base-image: docker.io/library/python:3.14-slim@sha256:ef30e8ee3a7f227b0b5b39669b2e656f35b56b918c6631820357c2a55ff5a428
          artifact-name: ${{ steps.sanitize.outputs.artifact_name }}
          ignore_unfixed: true
